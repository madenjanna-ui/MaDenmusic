<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>MaDenMusic</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background"></div>

<header>

<h1>MaDenMusic</h1>

<input
id="search"
type="text"
placeholder="Поиск песни...">

</header>

<main>

<section id="homePage">

<h2 class="sectionTitle">
✨ Новые релизы
</h2>

<div id="newSongs"></div>

<button
id="showAllSongs"
class="bigButton">

🎵 Все песни

</button>

</section>


<section
id="catalogPage"
class="hiddenPage">

<div class="catalogHeader">

<button id="backHome">

← Главная

</button>

<select id="sortSongs">

<option value="new">
🆕 Сначала новые
</option>

<option value="old">
📅 Сначала старые
</option>

<option value="name">
🔤 По названию
</option>

</select>

</div>

<div id="songList"></div>

</section>

</main>

<!-- Плеер -->

<div
id="player"
class="player hidden">

<button id="closePlayer">

✕

</button>

<img
id="cover"
class="cover"
src=""
alt="">

<h2 id="songTitle"></h2>

<p id="songArtist"></p>

<div class="progress">

<input
id="progress"
type="range"
min="0"
max="100"
value="0">

<div class="time">

<span id="currentTime">

0:00

</span>

<span id="duration">

0:00

</span>

</div>

</div>

<div class="controls">

<button id="prev">

⏮

</button>

<button id="play">

▶️

</button>

<button id="next">

⏭

</button>

</div>

<div class="lyrics">

<h3>

Текст песни

</h3>

<p id="lyrics"></p>

</div>

<audio id="audio"></audio>

</div>

<script src="songs.js"></script>

<script src="app.js"></script>

</body>

</html>
