<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07091a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MaDenMusic">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<title>MaDenMusic</title>
</head>
<body>

<div class="background"></div>

<header>
  <h1>MaDenMusic</h1>
  <input id="search" type="text" placeholder="Поиск песни..." autocomplete="off">
</header>

<main>
  <section id="homePage">
    <div class="sectionHeading">
      <h2 class="sectionTitle">✨ Новые релизы</h2>
      <span class="sectionHint">за последние 14 дней</span>
    </div>
    <div id="newSongs"></div>
    <button id="showAllSongs" class="bigButton">🎵 Все песни</button>
  </section>

  <section id="catalogPage" class="hiddenPage">
    <div class="catalogHeader">
      <button id="backHome" class="textButton">← Главная</button>
      <select id="sortSongs">
        <option value="new">🆕 Сначала новые</option>
        <option value="old">📅 Сначала старые</option>
        <option value="name">🔤 По названию</option>
      </select>
    </div>
    <div class="catalogTools">
      <button id="favoritesFilter" class="filterButton" type="button">♡ Любимые</button>
      <span id="catalogCount"></span>
    </div>
    <div id="songList"></div>
  </section>
</main>

<div id="miniPlayer" class="mini-player hidden-mini">
    <img id="miniCover" class="mini-cover" src="" alt="">
    <div class="mini-info">
        <div id="miniTitle" class="mini-title">—</div>
        <div id="miniArtist" class="mini-artist">MaDen</div>
    </div>
    <button id="miniPlay" class="mini-button" aria-label="Воспроизвести">▶</button>
    <button id="miniOpen" class="mini-button mini-open" aria-label="Открыть плеер">⌃</button>
</div>

<div id="player" class="player hidden">
  <div class="playerGlow"></div>
  <button id="closePlayer" class="roundButton" aria-label="Закрыть">×</button>

  <div class="playerTop">
    <span>Сейчас играет</span>
    <button id="favoritePlayer" class="favoritePlayer" type="button" aria-label="Добавить в любимые">♡</button>
  </div>

  <img id="cover" class="cover" src="" alt="">
  <h2 id="songTitle"></h2>
  <p id="songArtist"></p>

  <div class="progress">
    <input id="progress" type="range" min="0" max="100" value="0" aria-label="Позиция песни">
    <div class="time"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
  </div>

  <div class="modeControls">
    <button id="shuffle" class="modeButton" type="button" aria-label="Случайное воспроизведение" title="Случайное воспроизведение">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 7h2.5c3.5 0 5 2 7 5s3.5 5 7 5H21M16 21h5v-5M4 17h2.5c1.8 0 3.1-.6 4.2-1.7M13.2 8.7C15 6.8 16.2 5 18.5 5H21"/></svg>
    </button>
    <button id="repeat" class="modeButton" type="button" aria-label="Повтор" title="Повтор">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4M21 13v2a3 3 0 0 1-3 3H3"/></svg>
      <span id="repeatBadge"></span>
    </button>
  </div>

  <div class="controls">
    <button id="prev" class="controlButton" aria-label="Предыдущая">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14M19 6 9 12l10 6z"/></svg>
    </button>
    <button id="play" class="playButton" aria-label="Воспроизвести">
      <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <button id="next" class="controlButton" aria-label="Следующая">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14M5 6l10 6-10 6z"/></svg>
    </button>
  </div>

  <div class="lyrics">
    <h3>Текст песни</h3>
    <p id="lyrics"></p>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<div id="toast" class="toast" aria-live="polite"></div>

<script src="songs.js"></script>
<script src="app.js"></script>
</body>
</html>
